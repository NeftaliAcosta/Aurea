name: CI & Security

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Unit Tests & Build
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Go Unit Tests
        run: go test -v -race ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Build Go CLI Binary
        run: go build -v -ldflags="-s -w" -o bin/aurae ./cmd/aurae

      - name: Validate Swift MenuBar App Compilation
        run: |
          mkdir -p bin
          swiftc -O -o bin/aurae-menubar cmd/app/main.swift

  security-scan:
    name: Vulnerability & CodeQL Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Go Vulnerability Check (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version: '1.24'
          go-package: ./...

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  package-release:
    name: Package Release Artifacts
    needs: [test, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build and Package Aurae.app
        run: |
          make build
          cd bin
          zip -r Aurae.app.zip Aurae.app aurae
          shasum -a 256 Aurae.app.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Aurae.app.zip
            bin/checksums.txt
          generate_release_notes: true
